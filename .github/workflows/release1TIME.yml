name: 🚀 ONE TIME LOL 

# ──────────────────────────────────────────────────────────────────
#  JIGAR TOOLS — Manual Release Publisher (Archive Branch)
#  Trigger: Actions tab → "Publish Release" → Run workflow
# ──────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - Archive
  workflow_dispatch:
    # Inputs removed. Hardcoded to v1.0 one-click deploy!

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      # ── 1. Full checkout (FORCED TO ARCHIVE BRANCH) ─────────────
      - name: ⬇️  Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Archive
          fetch-depth: 0

      # ── 2. Resolve previous release tag ─────────────────────────
      - name: 🏷️  Find previous release tag
        id: prev
        run: |
          PREV=$(git tag --sort=-version:refname \
                 | grep -v "^1.0$" \
                 | head -1)

          if [[ -z "$PREV" ]]; then
            PREV=$(git rev-list --max-parents=0 HEAD)
            echo "first_release=true" >> "$GITHUB_OUTPUT"
            echo "prev_display=the beginning of time" >> "$GITHUB_OUTPUT"
          else
            echo "first_release=false" >> "$GITHUB_OUTPUT"
            echo "prev_display=$PREV" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous baseline: $PREV"

      # ── 3. Generate changelog from raw commits ───────────────────
      - name: 📝  Generate changelog
        id: changelog
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
          NEW_TAG:  "1.0"
          PREV_DISPLAY: ${{ steps.prev.outputs.prev_display }}
        run: |
          COMMITS=$(git log "${PREV_TAG}..HEAD" \
                      --pretty=format:"%H|%s|%an" \
                      --no-merges \
                      --reverse)

          FEAT=()   
          IMPR=()   
          FIX=()    
          PERF=()   
          DOCS=()   
          CLEAN=()  
          BREAK=()  
          OTHER=()  

          while IFS='|' read -r hash subject author; do
            [[ -z "$hash" ]] && continue

            SHORT="${hash:0:7}"
            URL="https://github.com/${{ github.repository }}/commit/$hash"
            LINK="[\`$SHORT\`]($URL)"
            LINE="- $LINK  **$subject** *(by $author)*"

            MSG_LOWER=$(echo "$subject" | tr '[:upper:]' '[:lower:]')

            case "$MSG_LOWER" in
              *"breaking"*|*"💥"*|*"!:"*)          BREAK+=("$LINE") ;;
              feat*|"✨"*|"🚀"*|"🎉"*|"🆕"*|"new"*|"add"*|"implement"*) FEAT+=("$LINE") ;;
              perf*|"🏎"*|"⚡"*|"🔥"*|"speed"*|"fast"*|"optim"*)         PERF+=("$LINE") ;;
              fix*|"🐛"*|"🔧"*|"🩹"*|"patch"*|"hotfix"*|"resolve"*)      FIX+=("$LINE") ;;
              "📝"*|"📚"*|doc*|readme*|"changelog"*|"license"*|"contrib"*) DOCS+=("$LINE") ;;
              "🗂"*|"🧹"*|"🗑"*|chore*|clean*|refactor*|rename*|move*|remove*) CLEAN+=("$LINE") ;;
              impr*|"🔼"*|updat*|enhanc*|upgrad*|bump*)                   IMPR+=("$LINE") ;;
              *)                                                            OTHER+=("$LINE") ;;
            esac
          done <<< "$COMMITS"

          TOTAL=$(echo "$COMMITS" | grep -c '.' || true)

          {
            echo "## 📦 What's in $NEW_TAG"
            echo ""
            echo "> **this is the first working version i built**"
            echo ""

            if [[ "${#BREAK[@]}" -gt 0 ]]; then
              echo "### 💥 Breaking Changes"
              for l in "${BREAK[@]}"; do echo "$l"; done
              echo ""
            fi

            if [[ "${#FEAT[@]}" -gt 0 ]]; then
              echo "### ✨ New Features"
              for l in "${FEAT[@]}"; do echo "$l"; done
              echo ""
            fi

            if [[ "${#IMPR[@]}" -gt 0 ]]; then
              echo "### 🔼 Improvements"
              for l in "${IMPR[@]}"; do echo "$l"; done
              echo ""
            fi

            if [[ "${#PERF[@]}" -gt 0 ]]; then
              echo "### ⚡ Performance"
              for l in "${PERF[@]}"; do echo "$l"; done
              echo ""
            fi

            if [[ "${#FIX[@]}" -gt 0 ]]; then
              echo "### 🐛 Bug Fixes"
              for l in "${FIX[@]}"; do echo "$l"; done
              echo ""
            fi

            if [[ "${#DOCS[@]}" -gt 0 ]]; then
              echo "### 📝 Documentation"
              for l in "${DOCS[@]}"; do echo "$l"; done
              echo ""
            fi

            if [[ "${#CLEAN[@]}" -gt 0 ]]; then
              echo "### 🗂️ Cleanup & Maintenance"
              for l in "${CLEAN[@]}"; do echo "$l"; done
              echo ""
            fi

            if [[ "${#OTHER[@]}" -gt 0 ]]; then
              echo "### 🔀 Other Changes"
              for l in "${OTHER[@]}"; do echo "$l"; done
              echo ""
            fi

            echo "---"
            echo ""
            echo "**$TOTAL commit(s)** since $PREV_DISPLAY"
            echo ""
            echo "---"
            echo ""
            echo "## 📥 Installation"
            echo ""
            echo '1. **Download** `Jigar_Tools_'"$NEW_TAG"'.zip` below'
            echo "2. **Extract** anywhere on your PC"
            echo "3. **Run** \`Jigar_Tools_Setup.bat\` as Administrator"
            echo "4. Connect your phone and choose your weapon 🚀"
            echo ""
            echo "---"
            echo ""
            echo "## 📋 Package Contents"
            echo ""
            echo '| File | Description |'
            echo '|---|---|'
            echo '| `JigarSmartSync.ps1` | Titan Backup Engine |'
            echo '| `JigarSmartRestore.ps1` | Titan Restore Engine |'
            echo '| `Jigar_Tools_Setup.bat` | Master Control Launcher |'
            echo '| `Jigar_Tools_Uninstall.bat` | Clean Uninstaller |'
            echo '| `logo.ico` | App icon |'
            echo '| `docs/` | CHANGELOG · CONTRIBUTING |'
            echo '| `LICENSE.md` | FriendlySource License |'
            echo '| `README.md` | Full documentation |'
            echo ""
            echo "---"
            echo ""
            echo "> **Made with raw energy by [Arvind Ji](https://github.com/official-Arvind) 🚀**"
            echo "> Free forever · [Official Repo](https://github.com/${{ github.repository }})"

          } > release_notes.md

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Generated $TOTAL commits into release notes."

      # ── 4. Build release title ───────────────────────────────────
      - name: 🏷️  Build release title
        id: title
        run: |
          FULL="🚀 Jigar Tools 1.0 — this is the first working version i built"
          echo "title=$FULL" >> "$GITHUB_OUTPUT"
          echo "Release title: $FULL"

      # ── 5. Package only the needed files ─────────────────────────
      - name: 📦  Build release ZIP
        run: |
          ZIPNAME="Jigar_Tools_1.0.zip"
          PKG="release_package"

          mkdir -p "$PKG/docs"

          # Core scripts & launcher
          cp JigarSmartSync.ps1      "$PKG/"
          cp JigarSmartRestore.ps1   "$PKG/"
          cp Jigar_Tools_Setup.bat   "$PKG/"
          cp Jigar_Tools_Uninstall.bat "$PKG/"

          # Assets & docs
          cp logo.ico   "$PKG/"
          cp LICENSE.md "$PKG/"
          cp README.md  "$PKG/"

          # docs/ folder (CHANGELOG, CONTRIBUTING)
          cp docs/CHANGELOG.md    "$PKG/docs/"
          cp docs/CONTRIBUTING.md "$PKG/docs/"

          # Create ZIP
          cd "$PKG"
          zip -r "../$ZIPNAME" . \
            --exclude "*.git*" \
            --exclude "*__pycache__*"

          cd ..
          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"

          # Report sizes
          echo ""
          echo "── Package contents ──────────────────────────"
          unzip -l "$ZIPNAME"
          echo "─────────────────────────────────────────────"
          du -sh "$ZIPNAME"

      # ── 6. Create the GitHub release ─────────────────────────────
      - name: 🎉  Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   "1.0"
          name:       ${{ steps.title.outputs.title }}
          body_path:  release_notes.md
          files:      ${{ env.ZIPNAME }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
